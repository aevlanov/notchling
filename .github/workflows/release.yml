name: Release

# Новая версия: поднять CFBundleShortVersionString в Info.plist и запушить в ветку release
# (git push origin main:release), либо поставить тег v0.1.1, либо Actions → Run workflow.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V=$(plutil -extract CFBundleShortVersionString raw Info.plist); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash release.sh "${{ steps.v.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" dist/Notchling-$V.zip dist/Notchling-$V.zip.sha256 \
            --target "$GITHUB_SHA" --title "Notchling $V" --notes-file RELEASE_NOTES.md \
            || gh release upload "v$V" dist/Notchling-$V.zip dist/Notchling-$V.zip.sha256 --clobber
