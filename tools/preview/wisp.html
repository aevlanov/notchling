<!doctype html>
<html><head><meta charset="utf-8"><title>Notchling preview</title>
<style>
  body { margin:0; background:#0d0d10; font-family: -apple-system, "Inter", sans-serif; color:#ddd; }
  .row { display:flex; gap:18px; padding:18px; align-items:flex-end; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:#9a9aa3 }
  canvas { background: #000; border-radius: 18px; }
</style></head>
<body>
<div id="rows"></div>
<script>
function params0(){ return new URLSearchParams(location.search); }
// Порт WispEngine.draw() для превью (та же геометрия).
const variants = {
  sky:   {tip:"#2F6BFF", mid:"#4FA3FF", core:"#D9F0FF", glow:"#5AB0FF", shape:"single", name:"Sky"},
  ember: {tip:"#FF4D2E", mid:"#FF9A3D", core:"#FFF0C2", glow:"#FF8A3D", shape:"double", name:"Ember"},
  mint:  {tip:"#0FA98F", mid:"#2ED3B7", core:"#E2FFF8", glow:"#3BE3C4", shape:"tall",   name:"Mint"},
  moon:  {tip:"#9AA6D6", mid:"#D7DCF2", core:"#FFFFFF", glow:"#C9D2FF", shape:"round",  name:"Moon"},
  plum:  {tip:"#7B3FE4", mid:"#B07BFF", core:"#F3E8FF", glow:"#A66BFF", shape:"curl",   name:"Plum"},
};
function flame(ctx, R, h, s1, s2, shape) {
  ctx.beginPath();
  ctx.moveTo(0, R);
  ctx.bezierCurveTo(-0.56*R, R, -R, 0.56*R, -R, 0);
  if (shape==="single") {
    ctx.bezierCurveTo(-R, -0.62*R, s1*0.6-0.32*R, -1.05*R*h, s1, -1.75*R*h);
    ctx.quadraticCurveTo(0.24*R+s1*0.5, -1.25*R*h, 0.3*R, -0.95*R*h);
    ctx.quadraticCurveTo(0.5*R, -1.02*R*h, 0.66*R+s2, -1.3*R*h);
    ctx.bezierCurveTo(0.88*R, -0.9*R*h, R, -0.5*R, R, 0);
  } else if (shape==="tall") {
    ctx.bezierCurveTo(-R, -0.5*R, -0.88*R, -0.95*R*h, -0.62*R+s2, -1.35*R*h);
    ctx.quadraticCurveTo(-0.48*R, -1.05*R*h, -0.3*R, -1.0*R*h);
    ctx.quadraticCurveTo(-0.3*R+s1*0.5, -1.5*R*h, s1, -2.05*R*h);
    ctx.bezierCurveTo(s1*0.6+0.32*R, -1.05*R*h, R, -0.62*R, R, 0);
  } else if (shape==="round") {
    const hh = 1.45;
    ctx.bezierCurveTo(-R, -0.62*R, s1*0.6-0.32*R, -1.05*R*h, s1, -hh*R*h);
    ctx.bezierCurveTo(s1*0.6+0.32*R, -1.05*R*h, R, -0.62*R, R, 0);
  } else if (shape==="double") {
    ctx.bezierCurveTo(-R, -0.55*R, -0.68*R, -1.1*R*h, -0.38*R+s2, -1.5*R*h);
    ctx.quadraticCurveTo(-0.2*R, -1.15*R*h, 0.02*R+s1*0.3, -0.95*R*h);
    ctx.quadraticCurveTo(0.12*R, -1.45*R*h, 0.42*R+s1, -1.85*R*h);
    ctx.bezierCurveTo(0.75*R, -1.2*R*h, R, -0.6*R, R, 0);
  } else {
    ctx.bezierCurveTo(-R, -0.7*R, -0.2*R+s1*0.5, -2.05*R*h, 0.5*R+s1, -1.85*R*h);
    ctx.quadraticCurveTo(0.42*R+s1, -1.6*R*h, 0.12*R+s1, -1.62*R*h);
    ctx.bezierCurveTo(0.5*R, -1.25*R*h, R, -0.62*R, R, 0);
  }
  ctx.bezierCurveTo(R, 0.56*R, 0.56*R, R, 0, R);
  ctx.closePath();
}
function ell(ctx,x,y,w,h){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);}
function draw(canvas, v, state, t) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const R = W*0.27, p = variants[v];
  const cx = W/2, cy = H*0.6;
  const flick = {idle:0.8, working:1.6, approval:1.8, finished:1.3, thinking:1.1, error:0.7}[state];
  const sp = 5.5, s1 = Math.sin(t*sp)*0.12*flick*R + Math.sin(t*sp*2.3)*0.05*flick*R, s2 = Math.sin(t*sp*1.3+2)*0.1*flick*R;
  const hgt = state==="approval"?1.18:(state==="working"?1.08:1);
  // glow
  ctx.save(); ctx.filter = `blur(${R*0.55}px)`; ctx.globalAlpha = {idle:0.35,working:0.6,approval:0.85,finished:0.9,thinking:0.5,error:0.6}[state];
  ctx.fillStyle = p.glow; ell(ctx, cx-R*1.25, cy-R*1.5, R*2.5, R*2.6); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(cx, cy);
  flame(ctx, R, hgt, s1, s2, p.shape);
  const g = ctx.createLinearGradient(0, -R*1.9, 0, R);
  g.addColorStop(0, p.tip); g.addColorStop(0.55, p.mid); g.addColorStop(1, p.mid);
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.translate(0, R*0.22); ctx.scale(0.68, 0.66); ctx.globalAlpha = 0.92;
  flame(ctx, R, hgt*0.85, s1*1.4, s2*1.4, p.shape);
  const rg = ctx.createRadialGradient(0, R*0.2, 0, 0, R*0.2, R*1.2);
  rg.addColorStop(0, p.core); rg.addColorStop(1, p.core+"BF");
  ctx.fillStyle = rg; ctx.fill(); ctx.restore();
  // face
  const ink = "#1D1631", ex = 0.34*R, ey = 0.18*R;
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap="round"; ctx.lineWidth = Math.max(1,0.07*R);
  for (const side of [-1,1]) {
    const x = side*ex, y = ey;
    if (state==="finished") { ctx.beginPath(); ctx.moveTo(x-0.11*R,y+0.04*R); ctx.quadraticCurveTo(x,y-0.14*R,x+0.11*R,y+0.04*R); ctx.stroke(); }
    else if (state==="error") { ctx.beginPath(); ctx.moveTo(x-0.1*R,y-0.03*R*side); ctx.lineTo(x+0.1*R,y+0.03*R*side); ctx.stroke(); }
    else { const w=(state==="approval"?0.24:0.19)*R, h=(state==="approval"?0.32:0.27)*R;
      ctx.fillStyle=ink; ell(ctx,x-w/2,y-h/2,w,h); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.95)"; ell(ctx,x-w*0.32,y-h*0.36,w*0.42,w*0.42); ctx.fill(); }
  }
  ctx.fillStyle = state==="finished" ? "rgba(255,127,168,.55)" : "rgba(255,127,168,.32)";
  for (const side of [-1,1]) { ell(ctx, side*0.6*R-0.12*R, 0.42*R, 0.24*R, 0.12*R); ctx.fill(); }
  const my = 0.46*R; ctx.beginPath();
  if (state==="finished") { ctx.moveTo(-0.14*R,my-0.02*R); ctx.quadraticCurveTo(0,my+0.2*R,0.14*R,my-0.02*R); ctx.stroke(); }
  else if (state==="approval") { ctx.fillStyle=ink; ell(ctx,-0.06*R,my-0.04*R,0.12*R,0.14*R); ctx.fill(); }
  else { ctx.lineWidth=Math.max(0.8,0.05*R); ctx.moveTo(-0.07*R,my); ctx.quadraticCurveTo(0,my+0.08*R,0.07*R,my); ctx.stroke(); }
  ctx.restore();
  if (state==="approval"||state==="error") {
    const c = {x: cx+0.95*R, y: cy-1.25*R}, r = 0.3*R;
    ctx.fillStyle = state==="error"?"#F4505E":"#FFB020"; ell(ctx,c.x-r,c.y-r,2*r,2*r); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillRect(c.x-0.045*R, c.y-0.17*R, 0.09*R, 0.21*R); ell(ctx,c.x-0.05*R,c.y+0.08*R,0.1*R,0.1*R); ctx.fill();
  }
  // embers
  for (let i=0;i<4;i++){ const f=((t*0.6+i*0.27)%1); ctx.globalAlpha = f<0.2?f/0.2:(1-f)/0.8;
    ctx.fillStyle=p.core; const x=cx+Math.sin(i*2.1+t)*0.3*R, y=cy-R-f*1.2*R; const s=0.07*R*(1-f*0.5);
    ell(ctx,x-s,y-s,2*s,2*s); ctx.fill(); }
  ctx.globalAlpha=1;
}
const states = ["idle","working","approval","finished","error"];
if (params0().get("icon")) {
  document.body.innerHTML = '<canvas id="ic" width="1024" height="1024"></canvas>';
  document.body.style.background = "transparent";
  const c = document.getElementById("ic"), x = c.getContext("2d");
  // фон-скруглённый квадрат (сетка macOS: 824px внутри 1024)
  const r = 185, o = 100, w = 824;
  x.beginPath(); x.roundRect(o, o, w, w, r);
  const bg = x.createLinearGradient(0, o, 0, o + w); bg.addColorStop(0, "#1b1a2e"); bg.addColorStop(1, "#07070c");
  x.fillStyle = bg; x.fill();
  // «чёлка» сверху
  x.fillStyle = "#000"; x.beginPath(); x.roundRect(o + w*0.28, o - 1, w*0.44, 70, [0,0,34,34]); x.fill();
  c.style.background = "transparent";
  x.save(); x.beginPath(); x.roundRect(o, o, w, w, r); x.clip();
  const off = document.createElement("canvas"); off.width = 800; off.height = 1000;
  draw(off, params0().get("icon"), "finished", 0.9);
  x.drawImage(off, 512 - 400, 1024 - 1000 + 20);
  x.restore();
  throw "icon";
}
const rows = document.getElementById("rows");
const params = params0();
const size = +(params.get("size")||150);
for (const v of Object.keys(variants)) {
  const row = document.createElement("div"); row.className="row";
  for (const s of states) {
    const cell = document.createElement("div"); cell.className="cell";
    const c = document.createElement("canvas"); c.width=size; c.height=Math.round(size*1.25);
    cell.appendChild(c); const l=document.createElement("div"); l.textContent=variants[v].name+" · "+s; cell.appendChild(l);
    row.appendChild(cell); draw(c, v, s, 0.7 + states.indexOf(s)*0.37);
  }
  rows.appendChild(row);
}
</script></body></html>
